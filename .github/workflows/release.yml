name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - name: Check release version and changelog
        shell: bash
        run: |
          release_version="$(jq -r .version custom_components/flic_button/manifest.json)"
          test "$GITHUB_REF_NAME" = "v$release_version"
          grep -Fq "## [$release_version] - " CHANGELOG.md

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_notes="$(awk -v heading="## [$release_version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          test -n "$release_notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Flic Buttons $release_version" --notes "$release_notes"
